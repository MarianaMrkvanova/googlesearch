<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jednoduché vyhledávání</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="home-page">
  <main class="home-main">
    <h1 class="home-logo" aria-label="Google">
      <span class="logo-blue">G</span><span class="logo-red">o</span><span class="logo-yellow">o</span><span class="logo-blue">g</span><span class="logo-green">l</span><span class="logo-red">e</span>
    </h1>

    <form class="home-form" action="https://www.google.com/search" method="get">
      <label for="search">Co chcete vyhledat?</label>
      <input
        type="search"
        id="search"
        name="q"
        placeholder="Zadejte hledaný text"
        required
      >
      <div class="home-buttons">
        <button type="submit">Hledat Googlem</button>
        <button type="submit" name="btnI" value="I'm Feeling Lucky">Cítím se šťastný</button>
      </div>
    </form>
  </main>
</body>
</html>
